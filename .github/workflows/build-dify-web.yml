name: Build custom Dify Web

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag"
        required: true
        default: "1.16.0-custom-1"

  push:
    branches:
      - "custom-web-1.16.0"
    paths:
      - "web/**"
      - ".github/workflows/build-dify-web.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push dify-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Prepare lowercase image name
        id: image
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${OWNER}/dify-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dify-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.image_tag || '1.16.0-custom-1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
